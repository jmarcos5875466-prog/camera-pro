name: Build Camera Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-feature android:name="android.hardware.camera.any" android:required="false" />'''
          if "android.permission.CAMERA" not in s:
              s = s.replace(marker, marker + "\n    " + permissions)
          p.write_text(s)
          PY
      - name: Add native Camera2 high-resolution plugin
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/br/com/camerapro/app
          cat > android/app/src/main/java/br/com/camerapro/app/NativeCameraPlugin.java <<'JAVA'
          package br.com.camerapro.app;
          import android.Manifest;
          import android.content.ContentValues;
          import android.hardware.camera2.*;
          import android.hardware.camera2.params.StreamConfigurationMap;
          import android.graphics.ImageFormat;
          import android.media.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.util.Size;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.*;
          import java.io.*;
          import java.nio.ByteBuffer;
          import java.text.SimpleDateFormat;
          import java.util.*;

          @CapacitorPlugin(name="NativeCamera", permissions={@Permission(alias="camera", strings={Manifest.permission.CAMERA})})
          public class NativeCameraPlugin extends Plugin {
            private HandlerThread worker;
            private Handler handler;

            @PluginMethod public void captureHighestResolution(PluginCall call) {
              if (getPermissionState("camera") != PermissionState.GRANTED) {
                requestPermissionForAlias("camera", call, "permissionResult"); return;
              }
              capture(call);
            }
            @PermissionCallback private void permissionResult(PluginCall call) {
              if (getPermissionState("camera") == PermissionState.GRANTED) capture(call);
              else call.reject("Permissão da câmera negada.");
            }
            private void capture(PluginCall call) {
              CameraManager cm=(CameraManager)getContext().getSystemService(android.content.Context.CAMERA_SERVICE);
              try {
                String chosen=null; Size largest=null; long pixels=0;
                for(String id:cm.getCameraIdList()) {
                  CameraCharacteristics cc=cm.getCameraCharacteristics(id);
                  Integer f=cc.get(CameraCharacteristics.LENS_FACING);
                  if(f==null || f!=CameraCharacteristics.LENS_FACING_BACK) continue;
                  StreamConfigurationMap map=cc.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP);
                  if(map==null) continue;
                  Size[] sizes=map.getOutputSizes(ImageFormat.JPEG);
                  if(sizes==null) continue;
                  for(Size z:sizes) { long n=(long)z.getWidth()*z.getHeight(); if(n>pixels){pixels=n;largest=z;chosen=id;} }
                }
                if(chosen==null || largest==null){call.reject("Nenhuma resolução JPEG encontrada.");return;}
                captureOnCamera(cm,chosen,largest,call);
              } catch(Exception e){call.reject("Erro ao consultar Camera2: "+e.getMessage(),e);}
            }
            private void captureOnCamera(CameraManager cm,String id,Size size,PluginCall call) throws Exception {
              worker=new HandlerThread("CameraPro-Camera2"); worker.start(); handler=new Handler(worker.getLooper());
              ImageReader reader=ImageReader.newInstance(size.getWidth(),size.getHeight(),ImageFormat.JPEG,2);
              final CameraDevice[] camera={null}; final CameraCaptureSession[] session={null}; final boolean[] done={false};
              Runnable cleanup=()->{try{if(session[0]!=null)session[0].close();}catch(Exception e){} try{if(camera[0]!=null)camera[0].close();}catch(Exception e){} try{reader.close();}catch(Exception e){} if(worker!=null){worker.quitSafely();worker=null;handler=null;}};
              reader.setOnImageAvailableListener(r->{
                Image image=null;
                try {
                  image=r.acquireNextImage(); if(image==null || done[0])return;
                  ByteBuffer buf=image.getPlanes()[0].getBuffer(); byte[] data=new byte[buf.remaining()]; buf.get(data);
                  ContentValues v=new ContentValues(); String stamp=new SimpleDateFormat("yyyyMMdd_HHmmss",Locale.US).format(new Date());
                  v.put(MediaStore.Images.Media.DISPLAY_NAME,"CameraPro_"+stamp+".jpg"); v.put(MediaStore.Images.Media.MIME_TYPE,"image/jpeg");
                  if(Build.VERSION.SDK_INT>=29){v.put(MediaStore.Images.Media.RELATIVE_PATH,"Pictures/Camera Pro");v.put(MediaStore.Images.Media.IS_PENDING,1);}
                  Uri uri=getContext().getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,v);
                  if(uri==null)throw new IOException("Falha ao criar arquivo na galeria.");
                  try(OutputStream out=getContext().getContentResolver().openOutputStream(uri)){if(out==null)throw new IOException("Falha ao gravar JPEG.");out.write(data);}
                  if(Build.VERSION.SDK_INT>=29){ContentValues doneValues=new ContentValues();doneValues.put(MediaStore.Images.Media.IS_PENDING,0);getContext().getContentResolver().update(uri,doneValues,null,null);}
                  done[0]=true; JSObject result=new JSObject();result.put("uri",uri.toString());result.put("width",size.getWidth());result.put("height",size.getHeight());result.put("megapixels",((double)size.getWidth()*size.getHeight())/1e6);call.resolve(result);cleanup.run();
                }catch(Exception e){if(!done[0]){done[0]=true;call.reject("Erro ao salvar foto: "+e.getMessage(),e);cleanup.run();}}
                finally{if(image!=null)image.close();}
              },handler);
              cm.openCamera(id,new CameraDevice.StateCallback(){
                @Override public void onOpened(CameraDevice c){camera[0]=c;try{c.createCaptureSession(Collections.singletonList(reader.getSurface()),new CameraCaptureSession.StateCallback(){
                  @Override public void onConfigured(CameraCaptureSession s){session[0]=s;try{CaptureRequest.Builder b=c.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE);b.addTarget(reader.getSurface());b.set(CaptureRequest.CONTROL_MODE,CameraMetadata.CONTROL_MODE_AUTO);b.set(CaptureRequest.JPEG_QUALITY,(byte)98);s.capture(b.build(),new CameraCaptureSession.CaptureCallback(){},handler);}catch(Exception e){if(!done[0]){done[0]=true;call.reject("Falha na captura: "+e.getMessage(),e);cleanup.run();}}}
                  @Override public void onConfigureFailed(CameraCaptureSession s){if(!done[0]){done[0]=true;call.reject("Falha ao configurar Camera2.");cleanup.run();}}
                },handler);}catch(Exception e){if(!done[0]){done[0]=true;call.reject("Falha ao iniciar Camera2: "+e.getMessage(),e);cleanup.run();}}}
                @Override public void onDisconnected(CameraDevice c){c.close();if(!done[0]){done[0]=true;call.reject("Câmera desconectada.");cleanup.run();}}
                @Override public void onError(CameraDevice c,int err){c.close();if(!done[0]){done[0]=true;call.reject("Erro Camera2: "+err);cleanup.run();}}
              },handler);
            }
            @Override protected void handleOnDestroy(){if(worker!=null){worker.quitSafely();worker=null;handler=null;}super.handleOnDestroy();}
          }
          JAVA
          MAIN="android/app/src/main/java/br/com/camerapro/app/MainActivity.java"
          if [ -f "$MAIN" ] && ! grep -q 'NativeCameraPlugin' "$MAIN"; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/java/br/com/camerapro/app/MainActivity.java")
          s=p.read_text()
          s=s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport br.com.camerapro.app.NativeCameraPlugin;")
          s=s.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(NativeCameraPlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
          p.write_text(s)
          PY
          fi

      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camera-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
